name: Scheduled site rebuild

on:
  schedule:
    # Rebuild hourly to pick up new Substack posts / podcast episodes.
    # GitHub delays scheduled runs under load, so treat this as approximate.
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: |
          curl -sf -X POST "${{ secrets.NETLIFY_BUILD_HOOK_URL }}" \
            || echo "::warning::Netlify build hook failed — check the secret is set"
